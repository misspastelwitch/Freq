
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Freq - Waveform Visualizer</title>

  <!-- Pixelated typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --background: #101a1c;
      --surface: #132b31;
      --surface-light: #1a363b;
      --text: #f3fbf8;
      --muted: #a4bcba;
      --line: #294347;
      --wave: #73f2c0;
      --wave-yellow: #ffe45c;
      --pixel-font: "Press Start 2P", monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: var(--pixel-font);
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
    }

    #app {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* Header */

    .topbar {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 20px 4vw;
      border-bottom: 1px solid var(--line);
      background: var(--background);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      line-height: 1.8;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 2px solid var(--wave);
      color: var(--wave);
      font-size: 18px;
    }

    .top-note {
      color: var(--muted);
      font-size: 8px;
      line-height: 1.8;
      text-align: right;
    }

    /* Full-page studio */

    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .studio {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    .studio-head {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 18px 4vw;
      border-bottom: 1px solid var(--line);
    }

    .studio-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 10px;
      line-height: 1.8;
    }

    .status-dot {
      flex-shrink: 0;
      width: 10px;
      height: 10px;
      background: #849b9b;
    }

    .status-dot.live {
      background: var(--wave);
      box-shadow: 0 0 14px var(--wave);
    }

    .status {
      color: var(--muted);
      font-size: 8px;
      line-height: 1.8;
      text-align: right;
    }

    /* Waveform uses approximately 80% of viewport height */

    .visual-area {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 2vh 2vw;
    }

    .canvas-wrap {
      position: relative;
      flex: 0 0 80vh;
      height: 80vh;
      min-height: 280px;
      max-height: 1000px;
      overflow: hidden;
      border: 1px solid #294347;
      background: #0d2023;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .canvas-label,
    .canvas-time {
      position: absolute;
      z-index: 1;
      top: 22px;
      color: var(--muted);
      font-size: 8px;
      line-height: 1.8;
      pointer-events: none;
    }

    .canvas-label {
      left: 22px;
    }

    .canvas-time {
      right: 22px;
      font-variant-numeric: tabular-nums;
    }

    /* Controls */

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      padding: 24px 0 12px;
    }

    .primary-btn {
      min-height: 56px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 16px 24px;
      border: 2px solid var(--wave);
      border-radius: 0;
      background: var(--wave);
      color: #102a25;
      font-size: 9px;
      line-height: 1.8;
      cursor: pointer;
      transition: background 150ms, color 150ms;
    }

    .primary-btn:hover {
      background: transparent;
      color: var(--wave);
    }

    .primary-btn:focus-visible {
      outline: 3px solid white;
      outline-offset: 5px;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .btn-icon {
      display: inline-block;
      flex-shrink: 0;
    }

    .btn-icon.play {
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-left: 10px solid currentColor;
    }

    .btn-icon.stop {
      width: 11px;
      height: 11px;
      background: currentColor;
    }

    .controls-hint {
      max-width: 600px;
      color: var(--muted);
      font-size: 8px;
      line-height: 2.2;
    }

    .footer-note {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 18px 4vw;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 7px;
      line-height: 2;
    }

    .footer-note svg {
      flex-shrink: 0;
      margin-top: 2px;
    }

    /* Smaller screens */

    @media (max-width: 700px) {
      .topbar {
        min-height: 64px;
        padding: 14px 18px;
      }

      .brand {
        font-size: 9px;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        font-size: 14px;
      }

      .top-note {
        max-width: 120px;
        font-size: 6px;
      }

      .studio-head {
        align-items: flex-start;
        flex-direction: column;
        padding: 18px;
      }

      .studio-title,
      .status {
        font-size: 8px;
        text-align: left;
      }

      .visual-area {
        padding: 12px;
      }

      .canvas-wrap {
        flex-basis: 80vh;
        height: 80vh;
        min-height: 260px;
      }

      .canvas-label,
      .canvas-time {
        top: 12px;
        font-size: 6px;
      }

      .canvas-label {
        left: 12px;
      }

      .canvas-time {
        right: 12px;
      }

      .controls {
        align-items: stretch;
        flex-direction: column;
        gap: 16px;
        padding-top: 18px;
      }

      .primary-btn {
        width: 100%;
        font-size: 8px;
      }

      .controls-hint {
        font-size: 7px;
      }

      .footer-note {
        padding: 14px 18px;
        font-size: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">~</span>
        <span>FREQ</span>
      </div>

      <div class="top-note">
        AUDIO INPUT / LIVE VISUALIZER
      </div>
    </header>

    <main>
      <section
        class="studio"
        aria-label="Live microphone waveform visualizer"
      >

        <div class="visual-area">
          <div class="canvas-wrap">
            <span class="canvas-label">AMPLITUDE / TIME</span>
            <span class="canvas-time" id="clock">00:00.0</span>

            <canvas
              id="waveform"
              aria-label="Live waveform display"
            ></canvas>
          </div>

          <div class="controls">
            <button
              class="primary-btn"
              id="toggleBtn"
              type="button"
            >
              <span
                class="btn-icon play"
                id="btnIcon"
                aria-hidden="true"
              ></span>
              <span id="btnText">START_MICROPHONE</span>
            </button>

            <div class="controls-hint" id="hintText">
              ALLOW MICROPHONE ACCESS WHEN PROMPTED
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer-note">
      <span>
        DON'T WORRY, AUDIO IS PROCESSED LOCALLY AND ISN'T STORED.
      </span>
    </footer>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("waveform");
      const ctx = canvas.getContext("2d");

      const toggleBtn = document.getElementById("toggleBtn");
      const btnText = document.getElementById("btnText");
      const btnIcon = document.getElementById("btnIcon");
      const statusText = document.getElementById("statusText");
      const statusDot = document.getElementById("statusDot");
      const hintText = document.getElementById("hintText");
      const clockText = document.getElementById("clock");

      let stream = null;
      let audioContext = null;
      let analyser = null;
      let source = null;

      let frameId = null;
      let startedAt = 0;
      let elapsedBeforeStart = 0;
      let running = false;

      let timeData = null;
      let frequencyData = null;
      let peakHold = 0;

      const WAVE_GREEN = "#73f2c0";
      const WAVE_YELLOW = "#ffe45c";

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.max(1, Math.round(rect.width * dpr));
        canvas.height = Math.max(1, Math.round(rect.height * dpr));

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        if (running) {
          drawWave();
        } else {
          drawIdle();
        }
      }

      function drawGrid(width, height) {
        ctx.clearRect(0, 0, width, height);

        ctx.fillStyle = "#0d2023";
        ctx.fillRect(0, 0, width, height);

        ctx.lineWidth = 1;
        ctx.strokeStyle = "#234044";

        for (let x = 0; x <= width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x + 0.5, 0);
          ctx.lineTo(x + 0.5, height);
          ctx.stroke();
        }

        for (let y = 0; y <= height; y += 32) {
          ctx.beginPath();
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(width, y + 0.5);
          ctx.stroke();
        }

        ctx.strokeStyle = "#42645e";
        ctx.setLineDash([4, 6]);

        ctx.beginPath();
        ctx.moveTo(0, height / 2);
        ctx.lineTo(width, height / 2);
        ctx.stroke();

        ctx.setLineDash([]);
      }

      function drawIdle() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;

        if (!width || !height) return;

        drawGrid(width, height);

        ctx.beginPath();
        ctx.moveTo(0, height / 2);

        for (let x = 0; x <= width; x++) {
          const fade = Math.sin(Math.PI * x / width);

          const y =
            height / 2 +
            Math.sin(x * 0.045) * 2.2 * fade +
            Math.sin(x * 0.13) * 0.8 * fade;

          ctx.lineTo(x, y);
        }

        ctx.strokeStyle = WAVE_GREEN;
        ctx.globalAlpha = 0.5;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      function updateClock() {
        const elapsed =
          elapsedBeforeStart + (performance.now() - startedAt);

        const totalTenths = Math.floor(elapsed / 100);
        const minutes = String(
          Math.floor(totalTenths / 600)
        ).padStart(2, "0");

        const seconds = String(
          Math.floor(totalTenths / 10) % 60
        ).padStart(2, "0");

        clockText.textContent =
          `${minutes}:${seconds}.${totalTenths % 10}`;
      }

      function drawWave() {
        if (!running || !analyser) return;

        const width = canvas.clientWidth;
        const height = canvas.clientHeight;

        if (!width || !height) {
          frameId = requestAnimationFrame(drawWave);
          return;
        }

        analyser.getByteTimeDomainData(timeData);
        analyser.getByteFrequencyData(frequencyData);

        // Middle C (C4) is approximately 261.63 Hz.
        const binHz = audioContext.sampleRate / analyser.fftSize;
        const middleCBin = Math.round(261.63 / binHz);
        const binRadius = Math.max(1, Math.round(5 / binHz));

        let middleCLevel = 0;

        for (
          let i = Math.max(0, middleCBin - binRadius);
          i <= Math.min(frequencyData.length - 1, middleCBin + binRadius);
          i++
        ) {
          middleCLevel = Math.max(
            middleCLevel,
            frequencyData[i]
          );
        }

        // Smooth the detection to reduce flickering.
        peakHold = middleCLevel > 145
          ? Math.min(1, peakHold + 0.22)
          : Math.max(0, peakHold - 0.08);

        const middleCHit = peakHold > 0.35;
        const waveColor = middleCHit
          ? WAVE_YELLOW
          : WAVE_GREEN;

        const waveGlow = middleCHit
          ? "rgba(255,228,92,0.42)"
          : "rgba(115,242,192,0.12)";

        statusText.textContent = middleCHit
          ? "MIDDLE_C_DETECTED / 261.6_HZ"
          : "LISTENING_LIVE";

        drawGrid(width, height);

        const middle = height / 2;

        ctx.beginPath();

        for (let i = 0; i < timeData.length; i++) {
          const x = i / (timeData.length - 1) * width;
          const y = (timeData[i] / 255) * height;

          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
        }

        ctx.lineWidth = middleCHit ? 3 : 2.2;
        ctx.strokeStyle = waveColor;
        ctx.shadowColor = waveColor;
        ctx.shadowBlur = middleCHit ? 24 : 8;
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.lineTo(width, middle);
        ctx.lineTo(0, middle);
        ctx.closePath();

        const gradient = ctx.createLinearGradient(
          0, 0, 0, height
        );

        gradient.addColorStop(
          0,
          "rgba(115,242,192,0.02)"
        );

        gradient.addColorStop(0.5, waveGlow);

        gradient.addColorStop(
          1,
          "rgba(115,242,192,0.02)"
        );

        ctx.fillStyle = gradient;
        ctx.fill();

        updateClock();

        frameId = requestAnimationFrame(drawWave);
      }

      async function start() {
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {
          statusText.textContent = "MICROPHONE_UNAVAILABLE";

          hintText.textContent =
            "OPEN THIS PAGE USING HTTPS OR LOCALHOST TO ACCESS THE MICROPHONE.";

          return;
        }

        toggleBtn.disabled = true;
        statusText.textContent = "WAITING_FOR_PERMISSION";

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            },
            video: false
          });

          audioContext = new (
            window.AudioContext || window.webkitAudioContext
          )();

          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }

          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.72;

          timeData = new Uint8Array(analyser.fftSize);

          frequencyData = new Uint8Array(
            analyser.frequencyBinCount
          );

          source = audioContext.createMediaStreamSource(stream);
          source.connect(analyser);

          running = true;
          startedAt = performance.now();
          peakHold = 0;

          toggleBtn.setAttribute(
            "aria-label",
            "Stop microphone"
          );

          btnText.textContent = "STOP_MICROPHONE";
          btnIcon.className = "btn-icon stop";

          statusText.textContent = "LISTENING_LIVE";
          statusDot.classList.add("live");

          hintText.innerHTML =
            "SPEAK, CLAP, OR MAKE A SOUND TO SEE THE WAVEFORM.<br>" +
            "PRESS STOP TO RELEASE YOUR MICROPHONE.";

          drawWave();
        } catch (error) {
          const messages = {
            NotAllowedError:
              "MICROPHONE ACCESS DENIED. CHECK YOUR BROWSER PERMISSIONS.",
            NotFoundError:
              "NO MICROPHONE FOUND. CONNECT OR ENABLE A MICROPHONE.",
            NotReadableError:
              "THE MICROPHONE MAY BE IN USE BY ANOTHER APPLICATION."
          };

          statusText.textContent = "MICROPHONE_ERROR";

          hintText.textContent =
            messages[error.name] ||
            `UNABLE TO ACCESS MICROPHONE: ${error.message || "UNKNOWN ERROR"}`;

          stop(false);
        } finally {
          toggleBtn.disabled = false;
        }
      }

      function stop(updateStatus = true) {
        if (running) {
          elapsedBeforeStart += performance.now() - startedAt;
        }

        running = false;

        if (frameId !== null) {
          cancelAnimationFrame(frameId);
        }

        frameId = null;

        if (source) {
          try {
            source.disconnect();
          } catch (_) {
            // The source may already be disconnected.
          }

          source = null;
        }

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }

        if (audioContext) {
          const oldContext = audioContext;

          audioContext = null;
          analyser = null;

          oldContext.close().catch(() => {});
        }

        statusDot.classList.remove("live");

        btnText.textContent = "START_MICROPHONE";
        btnIcon.className = "btn-icon play";

        toggleBtn.setAttribute(
          "aria-label",
          "Start microphone"
        );

        if (updateStatus) {
          statusText.textContent = "MICROPHONE_OFF";

          hintText.innerHTML =
            "ALLOW MICROPHONE ACCESS WHEN PROMPTED";
        }

        drawIdle();
      }

      toggleBtn.addEventListener("click", () => {
        if (running) {
          stop();
        } else {
          start();
        }
      });

      window.addEventListener("resize", resizeCanvas);

      document.addEventListener("visibilitychange", () => {
        if (document.hidden && running) {
          // Microphone capture remains active.
        }
      });

      resizeCanvas();
    })();
  </script>
</body>
</html>
